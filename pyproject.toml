[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trust-eval"
version = "0.1.0"
description = "PM-friendly evaluation pipeline for trustworthy multi-turn assistants"
requires-python = ">=3.9"
dependencies = ["openpyxl>=3.1", "python-docx>=1.1"]

[project.scripts]
trust-eval = "trust_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
